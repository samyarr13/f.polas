<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاطمیه پلاس | مرجع تخصصی مداحی و نوحه دهه فاطمیه</title>
    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --bg-primary: #0a0a0a;
            --bg-card: #141414;
            --border-color: #2a2a2a;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f3e5ab;
            --accent-red: #800000;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --font-family: 'Tahoma', 'Segoe UI', Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* ANIMATED FLAG AT TOP */
        .top-flag-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            z-index: 100;
            perspective: 1000px;
        }

        .fatemiye-flag {
            width: 100%;
            max-width: 900px;
            height: auto;
            max-height: 220px;
            object-fit: contain;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transform-origin: top center;
            animation: flagDrop 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        @keyframes flagDrop {
            0% {
                opacity: 0;
                transform: translateY(-100%) rotateX(-30deg);
            }
            70% {
                transform: translateY(10px) rotateX(10deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateX(0deg);
            }
        }

        /* HEADER & LOGO */
        header {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .logo-wrapper {
            width: 300px;
            height: 90px;
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.03);
        }

        .site-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-align: center;
        }

        /* NAVIGATION & FILTER TABS */
        .controls-container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .filter-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-red);
            color: #ffffff;
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* AUDIO LIST & CARDS */
        .main-content {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .audio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .audio-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .audio-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        .card-banner {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }

        .badge-year {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(128, 0, 0, 0.85);
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            border: 1px solid var(--accent-gold);
        }

        .badge-top {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(212, 175, 55, 0.9);
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .audio-title {
            font-size: 1.1rem;
            color: var(--accent-gold);
            margin-bottom: 6px;
        }

        .audio-reciter {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* IN-SITE PLAYER */
        audio {
            width: 100%;
            height: 40px;
            margin-bottom: 15px;
            outline: none;
            border-radius: 5px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn-action {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: background 0.3s ease;
            font-family: inherit;
        }

        .btn-download {
            background-color: #1b4d2e;
            color: #ffffff;
            border-color: #277244;
        }

        .btn-download:hover {
            background-color: #23633b;
        }

        .btn-lyrics {
            background-color: #2a2a2a;
            color: var(--text-main);
        }

        .btn-lyrics:hover {
            background-color: #3d3d3d;
        }

        /* LYRICS EXPANDABLE BOX */
        .lyrics-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background-color: #0d0d0d;
            border-radius: 6px;
            border-right: 3px solid var(--accent-gold);
            font-size: 0.85rem;
            color: #cccccc;
            white-space: pre-line;
            max-height: 150px;
            overflow-y: auto;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- TOP ANIMATED FLAG -->
    <div class="top-flag-container">
        <img class="fatemiye-flag" src="https://www.asr-entezar.ir/gallery/images/fatemiyye-flag.png" alt="پرچم عزاداری دهه فاطمیه" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Calligraphy_of_Fatimah_al-Zahra.svg/1024px-Calligraphy_of_Fatimah_al-Zahra.svg.png';">
    </div>

    <!-- HEADER WITH SVG LOGO -->
    <header>
        <div class="logo-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="100%" height="90">
              <defs>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#d4af37" />
                  <stop offset="100%" stop-color="#aa7c11" />
                </linearGradient>
              </defs>
              <rect width="100%" height="100%" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
              <path d="M 12 12 L 288 12 L 288 78 L 12 78 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,2"/>
              <circle cx="45" cy="45" r="22" fill="#800000" stroke="url(#goldGrad)" stroke-width="1.5"/>
              <text x="45" y="52" font-family="Tahoma, Arial" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">+</text>
              <text x="170" y="42" font-family="Tahoma, Arial" font-size="22" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold">فاطمـیـه پـلاس</text>
              <text x="170" y="62" font-family="Tahoma, Arial" font-size="11" fill="#9e9e9e" text-anchor="middle">پایگاه جامع مداحی و نوحه اهل بیت (ع)</text>
            </svg>
        </div>
        <p class="site-description">آرشیو تخصصی و آنلاین نوحه، مداحی و اشعار ایام شهادت حضرت فاطمه زهرا (سلام‌الله‌علیها)</p>
    </header>

    <!-- NAVIGATION / FILTERS -->
    <div class="controls-container">
        <button class="filter-btn active" onclick="filterCategory('all')">همه مداحی‌ها</button>
        <button class="filter-btn" onclick="filterCategory('top')">⭐ برترین مداحی‌ها</button>
        <button class="filter-btn" onclick="filterCategory('1405')">سال ۱۴۰۵</button>
        <button class="filter-btn" onclick="filterCategory('1404')">سال ۱۴۰۴</button>
        <button class="filter-btn" onclick="filterCategory('1399')">سال ۱۳۹۹</button>
    </div>

    <!-- MAIN AUDIO GRID -->
    <main class="main-content">
        <div class="audio-grid" id="audioGrid">
            <!-- Dynamic Audio Cards Loaded via JS -->
        </div>
    </main>

    <footer>
        <p>سامانه فاطمیه پلاس - تمامی حقوق محتوا متعلق به ذاکران و رسانه‌های اهل بیت (ع) می‌باشد.</p>
    </footer>

    <!-- JAVASCRIPT FOR DYNAMIC DISPLAY AND PLAYBACK -->
    <script>
        // Track Repository Data
        const trackData = [
            {
                id: 1,
                title: "بر روح بلندت سلام",
                reciter: "سید مجید بنی‌فاطمه",
                year: "1404",
                isTop: true,
                audioUrl: "https://dl.musicsweb.ir/musicdl/Majid-Banifateme-Bar-Roohe-Bolandat-Salam-3d7c0d.mp3",
                imageUrl: "https://www.asr-entezar.ir/gallery/images/fatemiyye-poster-1.jpg",
                lyrics: "اسم تو میبارد از نفس باران\nنور رخت دارد جلوه بی‌پایان\nبر روح بلندت سلام..."
            },
            {
                id: 2,
                title: "به نام نامی فاطمه",
                reciter: "محمد حسین پویانفر",
                year: "1404",
                isTop: true,
                audioUrl: "https://dl.musicsweb.ir/musics/02/09/Mohammad%20Hossein%20Pooyanfar%20-%20Be%20Name%20Namie%20Fateme%20-%20320.mp3",
                imageUrl: "https://www.asr-entezar.ir/gallery/images/fatemiyye-poster-2.jpg",
                lyrics: "به نام نامی فاطمه؛ به اذن شاه کربلا..\nبه نام ماه علقمه؛ به اذن حضرت مرتضی.."
            },
            {
                id: 3,
                title: "تسبیحات حضرت زهرا (س)",
                reciter: "حاج مهدی رسولی",
                year: "1399",
                isTop: true,
                audioUrl: "https://dl.musicsweb.ir/madahi/99/Mehdi%20Rasooli%20-%20Tasbihat.mp3",
                imageUrl: "https://www.asr-entezar.ir/gallery/images/fatemiyye-poster-3.jpg",
                lyrics: "الله اکبر این همه جلال\nالله اکبر این همه شکوه..."
            },
            {
                id: 4,
                title: "چه فاطمیه‌ای شد امسال",
                reciter: "حاج محمود کریمی",
                year: "1405",
                isTop: false,
                audioUrl: "https://dl.musicsweb.ir/musicdl/karimi-che-fatemieie-shod-emsal128-9da534.mp3",
                imageUrl: "https://www.asr-entezar.ir/gallery/images/fatemiyye-poster-4.jpg",
                lyrics: "وای فرشته بی پر آمد\nوای امید رهبر آمد..."
            },
            {
                id: 5,
                title: "پناهمی مادر",
                reciter: "حسین طاهری",
                year: "1405",
                isTop: false,
                audioUrl: "https://dl.musicsweb.ir/musicdl/Hossein-Taheri-Panahami-Madar-21aa6e.mp3",
                imageUrl: "https://www.asr-entezar.ir/gallery/images/fatemiyye-poster-5.jpg",
                lyrics: "پناهمی مادر پناه روزای تنهایی\nتویی که درمون دردایی..."
            },
            {
                id: 6,
                title: "ای نور فوق نور",
                reciter: "حاج محمود کریمی",
                year: "1404",
                isTop: true,
                audioUrl: "https://dl.musicsweb.ir/musicdl/Mahmoud-Karimi-Fogha-Noor-773914.mp3",
                imageUrl: "https://www.asr-entezar.ir/gallery/images/fatemiyye-poster-6.jpg",
                lyrics: "ای نور ای نور علی نور\nای نور فوق نور، مادر شأن تو سراسر..."
            },
            {
                id: 7,
                title: "مادر غمخوار",
                reciter: "حاج مهدی رسولی",
                year: "1399",
                isTop: false,
                audioUrl: "https://dl.musicsweb.ir/madahi/99/Mehdi%20Rasooli%20-%20Madare%20Ghamkhar.mp3",
                imageUrl: "https://www.asr-entezar.ir/gallery/images/fatemiyye-poster-1.jpg",
                lyrics: "دلم از این میسوزه تو مدینه یکی نمیگه چه غصه ای داری..."
            },
            {
                id: 8,
                title: "بی تو یا زهرا آه از این دنیا",
                reciter: "حاج میثم مطیعی",
                year: "1399",
                isTop: false,
                audioUrl: "https://dl.musicsweb.ir/madahi/99/Meysam%20motiee%20-%20Bi%20To.mp3",
                imageUrl: "https://www.asr-entezar.ir/gallery/images/fatemiyye-poster-2.jpg",
                lyrics: "بی تو یا زهرا، آه از این دنیا\nعلی تنها مانده میان غم‌ها..."
            }
        ];

        // Render Audio Cards Function
        function renderCards(data) {
            const grid = document.getElementById('audioGrid');
            grid.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'audio-card';

                card.innerHTML = `
                    <span class="badge-year">سال ${item.year}</span>
                    ${item.isTop ? '<span class="badge-top">برترین</span>' : ''}
                    <img class="card-banner" src="${item.imageUrl}" alt="${item.title}" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Calligraphy_of_Fatimah_al-Zahra.svg/1024px-Calligraphy_of_Fatimah_al-Zahra.svg.png';">
                    <div class="card-body">
                        <h3 class="audio-title">${item.title}</h3>
                        <p class="audio-reciter">${item.reciter}</p>
                        
                        <!-- Embedded HTML5 Audio Player -->
                        <audio controls preload="none">
                            <source src="${item.audioUrl}" type="audio/mpeg">
                            مرورگر شما از پخش مستقیم صوت پشتیبانی نمی‌کند.
                        </audio>

                        <div class="card-actions">
                            <a href="${item.audioUrl}" target="_blank" download class="btn-action btn-download">⬇ دانلود MP3</a>
                            <button class="btn-action btn-lyrics" onclick="toggleLyrics(${item.id})">📜 متن نوحه</button>
                        </div>
                        <div class="lyrics-box" id="lyrics-${item.id}">${item.lyrics}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Toggle Lyrics Visibility
        function toggleLyrics(id) {
            const box = document.getElementById(`lyrics-${id}`);
            if (box.style.display === 'block') {
                box.style.display = 'none';
            } else {
                box.style.display = 'block';
            }
        }

        // Filter Category Handler
        function filterCategory(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderCards(trackData);
            } else if (category === 'top') {
                const filtered = trackData.filter(item => item.isTop);
                renderCards(filtered);
            } else {
                const filtered = trackData.filter(item => item.year === category);
                renderCards(filtered);
            }
        }

        // Initial Page Render
        document.addEventListener('DOMContentLoaded', () => {
            renderCards(trackData);
        });
    </script>
</body>
</html>
